[package]
name = "bootctl-unified"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lints]
workspace = true
[features]
# The library is serving only. The standalone module binary (its install plan, vendor probe
# and native backends) needs `standalone`; a consumer linking only `serve` uses
# `default-features = false`.
default = ["standalone"]
standalone = ["dep:generic-bootctl-backends"]
[dependencies]
generic-bootctl-core = { path = "../../crates/core" }
generic-bootctl-aidl = { path = "../../crates/aidl" }
generic-bootctl-backends = { path = "../../crates/backends", optional = true }
generic-bootctl-hidl = { path = "../../crates/hidl" }

[[bin]]
name = "bootctl-unified"
path = "src/main.rs"
required-features = ["standalone"]
