[workspace]
members = ["crates/core", "crates/aidl", "crates/hidl", "crates/legacy", "crates/backends", "bin/bootctl-unified"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
