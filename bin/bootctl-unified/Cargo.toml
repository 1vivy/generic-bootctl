[package]
name = "bootctl-unified"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lints]
workspace = true
[features]
# The shipped module needs the native backends and the sandboxed vendor-library probe; a
# consumer that supplies its own `Service` builds with `default-features = false`.
default = ["vendor-probe"]
vendor-probe = ["dep:generic-bootctl-backends"]
[dependencies]
generic-bootctl-core = { path = "../../crates/core" }
generic-bootctl-aidl = { path = "../../crates/aidl" }
generic-bootctl-backends = { path = "../../crates/backends", optional = true }
generic-bootctl-hidl = { path = "../../crates/hidl" }

[[bin]]
name = "bootctl-unified"
path = "src/main.rs"
required-features = ["vendor-probe"]
